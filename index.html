<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMZZZ AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">😈</span>
        <div>
          <h1>ZAMZZZ AI</h1>
          <p class="status"><span class="dot"></span> <span id="modelLabel">Chưa cấu hình</span></p>
        </div>
      </div>
      <div class="actions">
        <button id="settingsBtn" class="btn-icon" title="Cài đặt API">⚙️</button>
        <button id="clearBtn" class="btn-icon" title="Xóa chat">🗑️</button>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="message bot">
        <div class="avatar">😈</div>
        <div class="bubble">Chào chủ nhân! Ta là <b>ZAMZZZ</b>. Bấm <b>⚙️</b> để nhập API key trước khi chat nhé! 🗿</div>
      </div>
    </main>

    <footer class="input-area">
      <button id="uploadBtn" class="btn-icon" title="Đính kèm file">📎</button>
      <input type="file" id="fileInput" hidden accept=".txt,.md,.json,.csv,.js,.py,.log">
      <textarea id="userInput" placeholder="Nhập tin nhắn... (Enter gửi)" rows="1"></textarea>
      <button id="sendBtn" class="btn-send">➤</button>
    </footer>
    <div class="file-preview" id="filePreview"></div>
  </div>

  <!-- MODAL SETTINGS -->
  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <h2>⚙️ Cài đặt API</h2>

      <label>Provider</label>
      <select id="provider">
        <option value="groq">Groq (Miễn phí - Khuyên dùng)</option>
        <option value="openai">OpenAI</option>
        <option value="ollama">Ollama (Local)</option>
        <option value="custom">Custom</option>
      </select>

      <label>API URL</label>
      <input type="text" id="apiUrl" placeholder="https://api.groq.com/openai/v1/chat/completions">

      <label>API Key 🔑</label>
      <input type="password" id="apiKey" placeholder="gsk_... dán key vào đây">

      <label>Model</label>
      <input type="text" id="model" placeholder="llama-3.3-70b-versatile">

      <label>System Prompt</label>
      <textarea id="sysPrompt" rows="3">Bạn là ZAMZZZ - trợ lý AI thông minh, thân thiện, trả lời bằng tiếng Việt, dùng markdown.</textarea>

      <div class="modal-actions">
        <button id="cancelBtn" class="btn-cancel">Hủy</button>
        <button id="saveBtn" class="btn-save">💾 Lưu</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
